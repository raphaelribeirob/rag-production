[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-production"
version = "0.0.1"
description = "Production-style RAG API: FastAPI + pgvector, local embeddings, CI-gated evals"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
# optional, local only, never installed in CI: in-process generation from a GGUF file
local-llm = ["llama-cpp-python>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
