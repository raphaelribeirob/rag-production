# Eval config. Retrieval runner: python -m rag_production.eval_runner (faithfulness TODO).
corpus: data/corpus/          # FastAPI docs, MIT (github.com/fastapi/fastapi)
labeled_set: evals/labeled_set.jsonl   # 35 questions, doc-level relevance
top_k: 5
llm_provider: extractive               # deterministic, used in CI
metrics: [hit_rate_at_k, recall_at_k, faithfulness]
faithfulness:
  judge: nli                           # local, free, deterministic (CI)
  model: cross-encoder/nli-deberta-v3-small
  device: cpu
  entailment_threshold: 0.5            # per-sentence entailment prob
offline_judges:                        # never gating; reported in README
  - name: llm_judge
    provider: ollama
    model: qwen2.5:7b
gates:
  hit_rate_at_5: 0.80
  recall_at_5: 0.70
  faithfulness: 0.85
report_dir: reports/
