name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: File length gate (350 lines)
        run: python tools/check_file_length.py
      - name: Lint (blocking)
        run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # TODO: add eval gate job once evals/ runner exists (see evals/README.md)
