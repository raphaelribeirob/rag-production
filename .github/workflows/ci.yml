name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only torch to keep CI small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Cache embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-l6-v2-nli-deberta-v3-small-v1
      - name: Fetch corpus (FastAPI docs, MIT, pinned commit)
        run: python tools/fetch_corpus.py
      - name: File length gate (350 lines)
        run: python tools/check_file_length.py
      - name: Lint (blocking)
        run: ruff check .
      - run: ruff format --check .
      - name: Migrate (pgvector extension, table, HNSW index)
        run: python tools/migrate.py
      - run: pytest -q
      - name: Retrieval eval gate (Recall@5 >= 0.70, Hit@5 >= 0.80; full labeled set)
        run: python -m rag_production.eval_runner --out reports/eval.json  # retrieval + NLI faithfulness gates
